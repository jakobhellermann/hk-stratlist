[package]
name = "map-export"
version = "0.1.0"
edition = "2024"
description = "Exports the Silksong world map (room layout, loadable scenes, room sprites) from the game files."

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["webp"] }
rabex = { version = "0.2", default-features = false, features = ["embed-tpk"] }
rabex-env = { git = "https://github.com/jakobhellermann/rabex-env", rev = "84efd2637678" }
rabex-texture = { git = "https://github.com/jakobhellermann/rabex-env", rev = "84efd2637678" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
